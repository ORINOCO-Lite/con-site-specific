# The www-from-model: prefix resolves inside the pinned www-from-model checkout.
version: 2

routing:
  strip_prefix: "xyzrins:"

homepage:
  pid: xyzrins:.
  template: www-from-model:page_templates/homepage.md.j2
  reverse_injections:
    - from: generated_by
      to: generated
    - from: part_of
      to: parts
  inline:
    - associated_with::object
    - associated_with::roles
    - influenced_by::object
    - influenced_by::roles
    - identifiers::creator
    - part_of

pages:
  xyzri:XYZDataset:
    template: www-from-model:page_templates/dataset.md.j2
    inline: [about, attributed_to::object, kind, rules, characterized_by::object]
  xyzri:XYZObjective:
    template: www-from-model:page_templates/objective.md.j2
    inline: [part_of, depends_on]
  xyzri:XYZTopic:
    template: www-from-model:page_templates/topic.md.j2
    inline: [part_of]
  xyzri:XYZProject:
    template: site-specific/templates/project.md.j2
    reverse_injections:
      - from: generated_by
        to: generated
      - from: part_of
        to: parts
    inline:
      - associated_with::object
      - associated_with::roles
      - influenced_by::object
      - influenced_by::roles
      - identifiers::creator
      - part_of
  xyzri:XYZPerson:
    template: site-specific/templates/person.md.j2
    select:
      linked_from:
        pid: xyzrins:.
        field: associated_with
    inline: [delegated_by::object, delegated_by::roles, identifiers::creator]
  xyzri:XYZPublication:
    template: www-from-model:page_templates/publication.md.j2
    inline: [about, attributed_to::object]
  xyzri:XYZInstrument:
    template: www-from-model:page_templates/instrument.md.j2
    inline: [about, attributed_to::object, kind, rules]

unrendered_classes:
  # The selected upstream update-from-pool workflow renders only the classes
  # above. These remain records for inlining, graph input, media and editing.
  - dlthings:AnnotationTag
  - dlthings:Property
  - dlthings:Rule
  - xyzri:XYZAccolade
  - xyzri:XYZActivity
  - xyzri:XYZCompetition
  - xyzri:XYZCompetitionType
  - xyzri:XYZDataType
  - xyzri:XYZDepiction
  - xyzri:XYZDepictionType
  - xyzri:XYZDocument
  - xyzri:XYZEntityRole
  - xyzri:XYZFile
  - xyzri:XYZGrant
  - xyzri:XYZOrganization
  - xyzri:XYZAgentRole
  - xyzri:XYZBibliographicType
  - xyzri:XYZInstrumentType
  - xyzri:XYZPublicationVenue
  - xyzri:XYZQuality
  - xyzri:XYZStudy
  - xyzri:XYZSubject
  - xyzri:XYZSubjectType

graph:
  producer: www-from-model:code/pool2graph.py
  node_classes:
    - xyzri:XYZDataset
    - xyzri:XYZInstrument
    - xyzri:XYZObjective
    - xyzri:XYZOrganization
    - xyzri:XYZPerson
    - xyzri:XYZProject
    - xyzri:XYZPublication
    - xyzri:XYZTopic
  relationship_fields:
    - about
    - associated_with
    - attributed_to
    - delegated_by
    - generated_by
    - influenced_by
    - part_of
  missing_external_targets: drop

references:
  missing_targets: preserve

editor:
  record_scope: all
