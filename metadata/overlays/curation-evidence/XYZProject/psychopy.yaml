# Evidence for every dated claim in records/XYZProject/psychopy.yaml.
#
# Shape follows con-site-specific's metadata/overlays/machine-provenance-
# annotations/: a `record` pid, and `assertions` that address the asserted
# value by JSON Pointer `path`.  The pointer is strictly better than the
# `supports: [start]` tag it replaces -- it names the exact slot, so a
# validator can check coverage instead of trusting a label.
#
# The extra keys (kind, bound, quote, confidence, captured, would_confirm) are
# CON-local.  PAV's importedBy/importedFrom describe a machine import; these
# describe a human reading a source and deciding what it supports.
