description: |-
  We work across data standards, such as [BIDS](https://bids.neuroimaging.io), [NWB](https://www.nwb.org), and [DICOM](https://www.dicomstandard.org), and across research initiatives, so that data, tools, and conventions from one community can be used in another.

  Standards and initiatives often grow up separately. The same data then has to be converted again for each one, and solutions found in one community rarely reach the next.
pid: xyzrins:objectives/cross-standards-harmonization
