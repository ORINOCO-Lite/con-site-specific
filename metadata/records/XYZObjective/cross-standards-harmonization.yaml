description: |-
  We are helping research communities agree on shared data standards, such as [BIDS](https://bids.neuroimaging.io) and [NWB](https://www.nwb.org), and building the converters and tools around them.

  When every group organizes its data its own way, each dataset needs custom conversion before anyone else can use it.
