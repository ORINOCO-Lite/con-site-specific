description: |-
  We are making research software and services that groups can run on their own computers, such as [NeuroDebian](https://neuro.debian.net), [Debian Med](https://www.debian.org/devel/debian-med/), [DANDI](https://dandiarchive.org), and [ORINOCO Lite](https://github.com/ORINOCO-Lite); [con/serve](https://con.github.io/serve/) collects how to run them.

  Many research groups depend on tools and services they do not control. When a provider changes its terms or shuts down, a group can lose the services its work depends on, and sometimes its data.
