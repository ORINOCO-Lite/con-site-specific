description: The emphasis is on creating software, workflows, and infrastructure that
  make data processing, analysis, and sharing reliable and repeatable. By providing
  versioned datasets, pipelines, and tooling (for example for neuroimaging and behavioral
  measurements), the aim is to reduce technical barriers, minimize errors, and help
  researchers reproduce results and reuse resources across projects.
