description: |-
  Develop and sustain open tools, standards, and workflows that help researchers reproduce and build on scientific work.

  A research result is easier to understand when people can see how it was produced. We help researchers keep their data, code, and working steps together, so they can repeat an analysis and others can check it or build on it.
