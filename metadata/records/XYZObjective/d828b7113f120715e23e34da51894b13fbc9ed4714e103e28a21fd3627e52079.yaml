description: 'Develop and test software, data standards, and analysis workflows that
  help researchers put new methods into practice.


  New methods become useful when other researchers can run them, inspect them, and
  build on them. We work with research communities to develop and test software, ways
  of organizing data, and analysis steps that work together. This helps people use
  research methods in their own studies.'
pid: xyzrins:objectives/translational-research-infrastructure
schema_type: xyzri:XYZObjective
title: Turn research ideas into working tools
