description: |-
  We are publishing data, code, and documentation in open archives such as [DANDI](https://dandiarchive.org) and [OpenNeuro](https://openneuro.org), and helping labs pool their studies.

  Much research data never leaves the lab that collected it. Results are then hard to check, and questions that need larger or more diverse samples go unanswered.
