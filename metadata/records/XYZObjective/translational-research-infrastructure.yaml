description: |-
  Support researchers and clinicians in adapting open research tools and data-management practices for research with potential clinical applications.

  Tools developed for basic research may also help people studying health and care. This proposed objective is to explore how our work can support those researchers and the clinicians they work with. This is a possible direction for CON to explore.
pid: xyzrins:objectives/translational-research-infrastructure
schema_type: xyzri:XYZObjective
title: Research infrastructure for translational research
