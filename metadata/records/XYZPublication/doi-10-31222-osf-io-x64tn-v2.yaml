description: International data privacy regulations impede the pooling of research data
  for collaborative analysis. We introduce Neurobagel, a federated network enabling
  cohort discovery across locally governed, access-controlled datasets. Through intuitive
  graphical tools and a decentralized query infrastructure, Neurobagel facilitates harmonization,
  control, and discovery of data according to local regulations. Today, Neurobagel is
  deployed by consortia and data platforms in Europe, North America, Asia, and Australia,
  supporting diverse and evolving regulatory frameworks.
