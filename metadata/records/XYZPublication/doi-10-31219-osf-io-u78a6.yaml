description: 'There has been a recent major upsurge in the concerns about reproducibility
  in many areas of science. Within the neuroimaging domain, one approach is to promote
  reproducibility is to target the re-executability of the publication. The information
  supporting such re-executability can enable the detailed examination of how an initial
  finding generalizes across changes in the processing approach, and sampled population,
  in a controlled scientific fashion. ReproNim: A Center for Reproducible Neuroimaging
  Computation is a recently funded initiative that seeks to facilitate the ‘last mile’
  implementations of core re-executability tools in order to reduce the accessibility
  barrier and increase adoption of standards and best practices at the neuroimaging
  research laboratory level. In this report, we summarize the overall approach and tools
  we have developed in this domain.'
