description: The Brain Imaging Data Structure (BIDS) is a widely adopted, community-driven
  standard to organize neuroimaging data and metadata. Although numerous extensions
  have been developed to incrementally extend coverage to new modalities and data types,
  an unambiguous, granular specification for eye-tracking recordings is lacking. Here,
  we present how BIDS will structure data and metadata produced by eye-tracking devices,
  including gaze position and pupil data. In addition to prescribing the organization
  of the unprocessed (raw) recordings and associated metadata as produced by the device,
  BEP20 also resolves gaps in current BIDS specifications beyond the scope of eye tracking.
  In particular, it adds a mechanism for including asynchronous model parameters and
  messages, such as contextual information, statuses, and events, such as triggers,
  generated by the device. BEP20 includes examples that illustrate its applicability
  in various experimental settings. This BIDS extension provides a robust standard that
  supports the development of self-adaptive, open, and automated eye-tracking data structures,
  thereby bolstering transparency and reliability of results in this field.
