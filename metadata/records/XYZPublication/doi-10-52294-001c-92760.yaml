description: OHBM Brainhack 2022 took place in June 2022. The first hybrid OHBM hackathon,
  it had an in-person component taking place in Glasgow and three hubs around the globe
  to improve inclusivity and fit as many timezones as possible. In the buzzing setting
  of the Queen Margaret Union and of the virtual platform, 23 projects were presented
  after development. Following are the reports of 14 of those, as well as a recapitulation
  of the organisation of the event.
