description: Neuroimaging data management and processing are tedious and error-prone,
  prompting reproducibility concerns. Globally, studies with heterogeneous infrastructure
  and governance policies lead to eclectic data processing and sharing, necessitating
  standardization of data workflows to ensure reusability and comparability of multi-centric
  datasets. The Nipoppy neuroinformatics framework facilitates such standardization
  by combining specification, protocol, and software to manage study-level data workflows.
  With its adoption, researchers can share standardized, derived datasets enabling efficient,
  reproducible, and inclusive research.
