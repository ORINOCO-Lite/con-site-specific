description: The sharing of research data is essential to ensure reproducibility and
  maximize the impact of public investments in scientific research. Here, we describe
  OpenNeuro, a BRAIN Initiative data archive that provides the ability to openly share
  data from a broad range of brain imaging data types following the FAIR principles
  for data sharing. We highlight the importance of the Brain Imaging Data Structure
  standard for enabling effective curation, sharing, and reuse of data. The archive
  presently shares more than 600 datasets including data from more than 20,000 participants,
  comprising multiple species and measurement modalities and a broad range of phenotypes.
  The impact of the shared data is evident in a growing number of published reuses,
  currently totalling more than 150 publications. We conclude by describing plans for
  future development and integration with other ongoing open science efforts.
