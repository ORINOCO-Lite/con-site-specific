description: Neuroimaging studies of object and action representation often use controlled
  stimuli and implicitly assume that the relevant neural representational spaces are
  fixed and context-invariant. Here we present functional MRI data measured while participants
  freely viewed brief naturalistic video clips of behaving animals in two different
  task contexts. Participants performed a 1-back category repetition detection task
  requiring them to attend to either animal taxonomy or animal behavior. The data and
  analysis code are freely available, and have been curated according to the Brain Imaging
  Data Structure (BIDS) standard. We thoroughly describe the data, provide quality control
  metrics, and perform a searchlight classification analysis to demonstrate the potential
  utility of the data. These data are intended to provide a test bed for investigating
  how task demands alter the neural representation of complex stimuli and their semantic
  qualities.
