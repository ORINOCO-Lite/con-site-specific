  value: The Past, Present, and Future of the Brain Imaging Data Structure (BIDS)
- predicate: dcterms:description
  schema_type: dlthings:AttributeSpecification
  value: The Brain Imaging Data Structure (BIDS) is a community-driven standard for
    the organization of data and metadata from a growing range of neuroscience modalities.
    This paper is meant as a history of how the standard has developed and grown over
    time. We outline the principles behind the project, the mechanisms by which it
    has been extended, and some of the challenges being addressed as it evolves. We
    also discuss the lessons learned through the project, with the aim of enabling
    researchers in other domains to learn from the success of BIDS.
