- predicate: dlthings:description_html
  schema_type: dlthings:AttributeSpecification
  value: '<p> <a href="http://open-brain-consent.readthedocs.org">Open Brain Consent</a>
    initiative aims to facilitate neuroimaging data sharing by providing an "out of the
    box" solution addressing human subjects concerns: a widely acceptable consent form
    allowing deposition of anonymized data to public data archives, and a collection
    of tools/pipelines to help anonymization of neuroimaging data making it ready for
    sharing. </p> <p>Initiated and managed by CON, OBC is now an international effort
    with materials for GDPR compliance and multiple internationalization efforts to make
    sure materials are available in all applicable languages. <a href="https://github.com/con/open-brain-consent/blob/master/CONTRIBUTING.rst">Contribute</a>
    if you see your language is missing!</p>'
