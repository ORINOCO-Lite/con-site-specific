- predicate: dlthings:description_html
  schema_type: dlthings:AttributeSpecification
  value: '<p> <a href="http://www.pymvpa.org">PyMVPA</a> is a Python-based framework for
    neural decoding using multivariate pattern analysis. It affords both volume- and surface-based
    analyses using a wide variety of supervised and unsupervised machine learning methods,
    representational similarity analyses, searchlight analyses, hyperalignment of representational
    spaces, and model-based decoding and encoding. The software also can be used for neural
    data other than fMRI, including analysis of MEG and EEG data through spatio-temporo-frequency
    band searchlights and cross-modal EEG to fMRI trans-fusion. It also has been used
    for analyses on data unrelated to neuroscience, demonstrating its general utility.
    PyMVPA also serves as a repository for sample data sets (e.g., Haxby et al. 2001)
    that has found wide applicability for education, development of new algorithms, or
    new analyses and independent research reports. </p> <ul> <li> <a href="/whoweare#michael_hanke_"
    class="centroid">M. Hanke</a>, <a href="/whoweare#yaroslav_o_halchenko_" class="centroid">Y.O.
    Halchenko</a>, et al. (2009). <a href="http://link.springer.com/article/10.1007%2Fs12021-008-9041-y">PyMVPA:
    A Python toolbox for multivariate pattern analysis of fMRI data.</a> Neuroinformatics,
    7, 37-53. DOI: 10.1007/s12021-008-9041-y </li> </ul>'
