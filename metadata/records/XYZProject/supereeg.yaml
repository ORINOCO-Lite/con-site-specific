- predicate: dlthings:description_html
  schema_type: dlthings:AttributeSpecification
  value: <p> <a href="https://supereeg.readthedocs.io/en/latest/">SuperEEG</a> is a Python toolbox
    for inferring whole-brain activity from sparse ECoG recordings. The way the technique works is
    to leverage data from different patients' brains (who had electrodes implanted in different locations)
    to learn a "correlation model" that describes how activity patterns at different locations throughout
    the brain relate. Given this model, along with data from a sparse set of locations, we use Gaussian
    process regression to "fill in" what the patients' brains were "most probably" doing when those
    recordings were taken. Details on our approach may be found in <a href="https://www.biorxiv.org/content/10.1101/121020">this
    preprint</a>. You may also be interested in watching <a href="https://www.youtube.com/watch?v=t6snLszEneA&amp;feature=youtu.be&amp;t=35">this
    talk</a> or reading this <a href="https://community.sfn.org/t/supereeg-ecog-data-breaks-free-from-electrodes/8344">blog
    post</a> from a recent conference. </p> <ul> <li> L.L.W. Owen, A.C. Heusser, and <a href="/whoweare#jeremy_rothman_manning_"
    class="centroid">J.R. Manning</a> (2018). <a href="https://www.biorxiv.org/content/10.1101/121020">A
    Gaussian process model of human electrocorticographic data</a>. bioRxiv, 121020. </li> </ul>
