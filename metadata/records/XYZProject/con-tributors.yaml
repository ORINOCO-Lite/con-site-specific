- predicate: dcterms:description
  schema_type: dlthings:AttributeSpecification
  value: con/tributors is a Python library and GitHub Action to automate maintenance of
    contributor attribution files. It updates all-contributors, Zenodo metadata (.zenodo.json),
    and CodeMeta (codemeta.json) files in one go, using a shared .tributors cache that
    maps GitHub logins to ORCID iDs and other persistent identifiers — so that contributor
    records stay consistent and up-to-date across all metadata files with a single command.
    For example, DataLad uses a dedicated GitHub Actions workflow powered by con/tributors
    to automatically keep its contributor files current.
