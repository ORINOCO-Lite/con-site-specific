- predicate: dlthings:description_html
  schema_type: dlthings:AttributeSpecification
  value: <p> <a href="https://github.com/con/tributors">con/tributors</a> is a Python
    library and GitHub Action to automate maintenance of contributor attribution files.
    It updates <a href="https://allcontributors.org">all-contributors</a>, <a href="https://zenodo.org">Zenodo</a>
    metadata (.zenodo.json), and <a href="https://codemeta.github.io/">CodeMeta</a> (codemeta.json)
    files in one go, using a shared <code>.tributors</code> cache that maps GitHub logins
    to ORCID iDs and other persistent identifiers — so that contributor records stay consistent
    and up-to-date across all metadata files with a single command. For example, DataLad
    uses a <a href="https://github.com/datalad/datalad/blob/master/.github/workflows/update-contributors.yml">dedicated
    GitHub Actions workflow</a> powered by con/tributors to automatically keep its contributor
    files current. </p>
