- predicate: dcterms:description
  schema_type: dlthings:AttributeSpecification
  value: Scanner QA data is acquired to watch the scanner, and then it is filed away.
    This asks what else it is good for -- whether the variance in routine phantom
    scans explains variance in the human data acquired around them, which would make
    years of accumulated QA scans a covariate rather than a formality.
- predicate: skos:prefLabel
  schema_type: dlthings:AttributeSpecification
