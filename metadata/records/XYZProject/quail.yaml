- predicate: dlthings:description_html
  schema_type: dlthings:AttributeSpecification
  value: '<p> <a href="https://cdl-quail.readthedocs.io/en/latest/">Quail</a> is a Python toolbox
    for analyzing data from free recall memory experiments. Some key features include: </p> <ul> <li>
    A simple data structure for storing encoding and recall data </li> <li> A set of functions for
    analyzing data by computing standard memory performance metrics </li> <li> A simple API for customizing
    plot styles </li> <li> Support for "naturalistic" stimuli such as movies, texts, and speech data
    </li> <li> A set of powerful tools for importing data, automatically transcribing audio files
    (speech-to-text), and more </li> </ul> <ul> <li> A.C. Heusser, P.C. Fitzpatrick, C.E. Field, K.
    Ziman, and <a href="/whoweare#jeremy_rothman_manning_" class="centroid">J.R. Manning</a> (2017).
    <a href="http://joss.theoj.org/papers/3fb5123eb2538e06f6a25ded0a088b73">Quail: A Python toolbox
    for analyzing and plotting free recall data</a>. The Journal of Open Source Software, 2(18): 424.
    </li> </ul>'
