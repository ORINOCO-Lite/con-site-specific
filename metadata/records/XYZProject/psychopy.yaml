# PsychoPy -- a collaborating project, NOT a CON project, hence no `part_of`.
#
# Two levels of time are in play and they are different claims:
#   `started` at the top level   -- when PsychoPy began
#   `started` inside an Association -- when a person's involvement began
# Keeping them apart is what lets this record say "we were NOT at the
# inception" rather than quietly implying we were.
pid: xyzrins:projects/psychopy
schema_type: xyzri:XYZProject
display_label: PsychoPy
title: PsychoPy
short_name: PsychoPy
description: >-
  Open-source package for running experiments in Python, created by Jon
  Peirce.
attributes:
  - predicate: foaf:homepage
    schema_type: dlthings:AttributeSpecification
    value: https://psychopy.org

# The project's own start, not ours.  Upper bound: the repository history was
# converted from SVN, so the real start is at or BEFORE this.  (An earlier
# draft of this comment said "lower" while the evidence said "upper" -- the
# ambiguity the bound rule exists to kill.)
started:
  schema_type: dlthings:Start
  at_time: "2008-04-09"

associated_with:
  # Upstream contributor.  94 commits across nine years.  The strongest
  # evidence is not the commit count -- it is that upstream credits us by
  # name, repeatedly (see the overlay).
  - schema_type: dlthings:Association
    object: xyzrins:persons/yaroslav-halchenko
    roles:
      - marcrel:ctb
    started:
      schema_type: dlthings:Start
      at_time: "2009-06-15"
    ended:
      schema_type: dlthings:End
      at_time: "2018-04-06"

  # Debian packaging.  49 of the 64 changelog entries are YOH's.  The End
  # carries a trigger: PROV's End is "when an activity is deemed to have been
  # ended by an entity, known as trigger", and the entity here is Debian Med
  # taking the package over.  That is where the old ad-hoc `transitioned_to`
  # belongs.
  #
  # What ended is ACTIVE maintenance, not formal standing.  Debian Med's
  # debian/control still lists Yaroslav Halchenko first under Uploaders in
  # 2026, so an unqualified "ended" would claim more than happened; the
  # schema has no slot distinguishing the two, so it is said here.
  #
  # The date was 2018-05-23 for one draft, which was the last CHANGELOG
  # trailer rather than the last packaging work -- three later commits exist
  # (2018-05-25 x2, 2018-09-26).  Rule 2 says "the newest artifact", not "the
  # newest artifact of the kind I happened to grep".
  - schema_type: dlthings:Association
    object: xyzrins:persons/yaroslav-halchenko
    roles:
      - xyzrins:agent-roles/debian-packager
    started:
      schema_type: dlthings:Start
      at_time: "2009-06-19"
    ended:
      schema_type: dlthings:End
      at_time: "2018-09-26"
      object: xyzrins:organizations/debian-med

  # Michael Hanke opened the Debian package, 14 months before the first
  # release.  Recorded because it is true and because it is the correction:
  # CON did not start this package, and Hanke is a collaborator, never CON.
  # The entry was UNRELEASED, so this is an attempt, not a release.
  - schema_type: dlthings:Association
    object: xyzrins:persons/michael-hanke
    roles:
      - xyzrins:agent-roles/debian-packager
    started:
      schema_type: dlthings:Start
      at_time: "2008-04-23"
