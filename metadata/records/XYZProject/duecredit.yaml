- predicate: dlthings:description_html
  schema_type: dlthings:AttributeSpecification
  value: <figure> <a href="https://datalad.org"><img src="/theme/img/3rd/duecredit_logo.png"
    alt="DueCredit" class="pull-left" style="width:155px;padding-right:10px;margin-top:0em;"
    /></a> </figure> <p> <a href="https://github.com/duecredit/duecredit">DueCredit</a>
    provides solution for the problem of inadequate citation and referencing of scientific
    software and methods. It provides a simple framework (at the moment for Python only)
    to embed publication or other references in the original code so they are automatically
    collected and reported to the user at the necessary level of reference detail, i.e.
    only references for actually used functionality will be presented back if software
    provides multiple citeable implementations. </p> <p> As a side-effect, we hope that
    DueCredit also will reduce demand in "prima-ballerina" projects, will encourage contributions
    to existing open-source codebases, and as a result would solidify scientific software
    ecosystem. </p> <ul> <li> <a href="/whoweare#yaroslav_o_halchenko_" class="centroid">Y.O.
    Halchenko</a> and <a href="/whoweare#matteo_visconti_di_oleggio_castello_" class="centroid">M.
    Visconti di Oleggio Castello</a> (2016). <a href="http://haxbylab.dartmouth.edu/publications/HV+OHBM16.pdf">
    DueCredit - automagically collect citations for software, methods, and data you use.
    </a> OHBM 2016, Geneva, Switzerland </li> </ul>
