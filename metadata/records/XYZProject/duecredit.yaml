- predicate: dlthings:description_html
  schema_type: dlthings:AttributeSpecification
  value: <p> <a href="https://github.com/duecredit/duecredit">DueCredit</a> provides solution
    for the problem of inadequate citation and referencing of scientific software and
    methods. It provides a simple framework (at the moment for Python only) to embed publication
    or other references in the original code so they are automatically collected and reported
    to the user at the necessary level of reference detail, i.e. only references for actually
    used functionality will be presented back if software provides multiple citeable implementations.
    </p> <p> As a side-effect, we hope that DueCredit also will reduce demand in "prima-ballerina"
    projects, will encourage contributions to existing open-source codebases, and as a
    result would solidify scientific software ecosystem. </p>
