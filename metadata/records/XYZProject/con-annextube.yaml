- predicate: dlthings:description_html
  schema_type: dlthings:AttributeSpecification
  value: '<p> <a href="https://github.com/con/annextube">con/annextube</a> is a YouTube-channel
    archiving system that uses <a href="http://git-annex.branchable.com">git-annex</a>
    for efficient, incremental storage of videos, metadata, comments, and captions. Archives
    are browsable offline through a client-side web interface generated by annextube itself.
    Actively maintained archives include: </p> <ul> <li> <a href="https://datasets.datalad.org/centerforopenneuroscience/contube/web/">CON/tube</a>
    — CON''s own channel archive (<a href="https://datasets.datalad.org/?dir=/centerforopenneuroscience/contube">dataset</a>)
    </li> <li> <a href="https://datasets.datalad.org/repronim/ReproTube/web/">ReproTube</a>
    — archive covering channels from <a href="http://repronim.org">ReproNim</a>, <a href="https://afni.nimh.nih.gov">AFNI</a>,
    <a href="https://datalad.org">DataLad</a>, and others (<a href="https://datasets.datalad.org/?dir=/repronim/ReproTube">dataset</a>)
    </li> </ul>'
