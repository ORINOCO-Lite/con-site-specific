- predicate: dlthings:description_html
  schema_type: dlthings:AttributeSpecification
  value: <p> <a href="https://github.com/con/duct">con/duct</a> (or just duct) is a lightweight
    wrapper that collects execution data for an arbitrary command. Execution data includes
    execution time, system information, and resource usage statistics of the command and
    all its child processes. duct is intended to simplify the problem of recording the
    resources necessary to execute a command, particularly in an HPC environment. Additionally
    duct includes optional helpers that interact with logs produced by duct exectutions.
    </p>
