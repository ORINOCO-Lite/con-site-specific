  schema_type: dlthings:AttributeSpecification
  value: <figure> <a href="https://github.com/con/duct"> <img src="/theme/img/3rd/duct.webp"
    alt="con/duct" class="pull-left" style="width:255px;padding-right:10px;margin-top:0em;"
    /> </a> </figure> <p> <a href="https://github.com/con/duct">con/duct</a> (or just
    duct) is a lightweight wrapper that collects execution data for an arbitrary command.
    Execution data includes execution time, system information, and resource usage statistics
    of the command and all its child processes. duct is intended to simplify the problem
    of recording the resources necessary to execute a command, particularly in an HPC
    environment. Additionally duct includes optional helpers that interact with logs produced
    by duct exectutions. </p>
