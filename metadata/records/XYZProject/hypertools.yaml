- predicate: dlthings:description_html
  schema_type: dlthings:AttributeSpecification
  value: '<p> <a href="https://hypertools.readthedocs.io/en/latest/">HyperTools</a> is a Python toolbox
    for gaining geometric insights into high dimensional data. Features include: </p> <ul> <li> Functions
    for plotting high-dimensional datasets in 2D and 3D </li> <li> Static and animated plots </li>
    <li> Simple API for customizing plot styles </li> <li> Set of powerful data manipulation tools
    including hyperalignment, <i>k</i>-means clustering, normalizing, and more </li> <li> Support
    of lists of Numpy arrays, Pandas dataframes, text, or (mixed) lists </li> <li> Applying topic
    models and other text and word embedding methods to text data </li> </ul> <ul> <li> A.C. Heusser,
    K. Ziman, L.L.W. Owen, and <a href="/whoweare#jeremy_rothman_manning_" class="centroid">J.R. Manning</a>
    (2018). <a href="http://www.jmlr.org/papers/volume18/17-434/17-434.pdf">HyperTools: a Python Toolbox
    for Gaining Geometric Insights into High-Dimensional Data</a>. Journal of Machine Learning Research,
    18: 1-6. </li> </ul>'
