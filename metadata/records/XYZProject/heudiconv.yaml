- predicate: dlthings:description_html
  schema_type: dlthings:AttributeSpecification
  value: <p> <a href="https://github.com/nipy/heudiconv">HeuDiConv</a> is a flexible DICOM
    converter for organizing brain imaging data into structured directory layouts. As
    a part of the larger, NIH supported <a href="http://repronim.org">ReproNim</a> effort,
    we are developing a HeuDiConv-based <a href="http://reproin.repronim.org">ReproIn</a>
    solution for turnkey automatic conversion of all collected MR data to a collection
    of the BIDS DataLad datasets. It includes a flexible BIDS-like specification how to
    name scanning sequences in the scanner, and a <a href="https://github.com/nipy/heudiconv/blob/master/heudiconv/heuristics/reproin.py">HeuDiConv
    reproin.py heuristic</a> to automate layout and conversion of the datasets. This solution
    is deployed at <a href="https://www.dartmouth.edu/dbic/">DBIC (Dartmouth Brain Imaging
    Center)</a>, it already facilitates reproducible research, data sharing, and uploads
    to central archives such as NDA. </p>
