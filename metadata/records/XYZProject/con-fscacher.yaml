- predicate: dlthings:description_html
  schema_type: dlthings:AttributeSpecification
  value: <p> <a href="https://github.com/con/fscacher">con/fscacher</a> is a Python library
    providing a persistent, file-content-aware memoization cache. Functions decorated
    with <code>@cache.memoize_path</code> are re-executed only when the fingerprint (timestamps
    + size) of their file arguments changes — making it easy to cache expensive operations
    on large file trees without stale results. It is used internally by the <a href="#dandi">DANDI</a>
    client and other CON tools. </p>
