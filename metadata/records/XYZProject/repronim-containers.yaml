- predicate: dcterms:description
  schema_type: dlthings:AttributeSpecification
  value: ReproNim/containers is a DataLad dataset providing a ready-to-use "distribution"
    of containerized neuroimaging environments (Singularity images) for reproducible analysis.
    It collects a curated set of containers — including those used by HeuDiConv and the
    broader ReproNim ecosystem — and exposes them via the ///repronim/containers DataLad
    dataset path, making it trivial to pin and share exact software environments alongside
    data and workflows.
