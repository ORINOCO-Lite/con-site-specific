- predicate: dlthings:description_html
  schema_type: dlthings:AttributeSpecification
  value: '<p> <a href="https://reprostim.readthedocs.io/en/latest/">ReproStim</a> captures
    the audio-visual stimuli actually presented during an experiment, into BIDS datasets
    -- so what the participant saw and heard is recorded rather than inferred from
    the script that was supposed to show it. <a href="https://reprostim.readthedocs.io/en/latest/_images/reproflow.svg">ReproFlow</a>
    is the setup around it, from the screen and the event relay through to the dataset.
    </p> <ul> <li> <a href="https://reprostim.readthedocs.io/en/latest/_images/reproflow.svg">The
    ReproFlow setup</a>, and a <a href="https://datasets.datalad.org/repronim/ReproTube/web/#/channel/ReproNim/video/SZ96Q6pwJzQ?tab=local&amp;wide=1">talk
    walking through it</a>. </li> <li> <a href="https://github.com/ReproNim/reprostim/tree/master/Events">ReproEvents</a>:
    the event relay that timestamps a button press in hardware rather than in
    whatever the stimulus computer was doing. </li> </ul>'
- predicate: dlthings:section
  schema_type: dlthings:AttributeSpecification
  value: Software
