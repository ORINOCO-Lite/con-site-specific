- predicate: dcterms:description
  schema_type: dlthings:AttributeSpecification
  value: Automated capture of the audio-visual stimuli actually presented during an
    experiment, into BIDS datasets -- so what the participant saw and heard is recorded
    rather than inferred from the script that was supposed to show it. ReproFlow is
    the setup around it, from the screen and the event relay through to the dataset.
