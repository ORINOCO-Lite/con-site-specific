- predicate: dlthings:description_html
  schema_type: dlthings:AttributeSpecification
  value: <p> <a href="https://datasets.datalad.org">datasets.datalad.org</a> is the instance
    of the original <a href="xyzrins:projects/datalad">DataLad</a> distribution. It provides
    access to a wide collection of data from various initiatives, such as <a href="https://datasets.datalad.org/?dir=/openfmri">OpenfMRI</a>,
    and hosts some datasets directly. A single <code>datalad install</code> of its superdataset
    reaches all of them, which arguably makes it one of the largest hierarchies of nested
    git repositories out there. </p>
