attributes:
- predicate: foaf:homepage
  schema_type: dlthings:AttributeSpecification
  value: https://stamped-principles.org
- predicate: dcterms:description
  schema_type: dlthings:AttributeSpecification
  value: STAMPED is a set of seven principles, Self-containment, Tracking, Actionability,
    Modularity, Portability, Ephemerality, and Distributability, for building research
    objects that others can trust, rerun, and build upon. Each principle is a spectrum
    from a practical minimum to an aspirational ideal, so adoption can be incremental
    and start from existing practice. STAMPED grew out of YODA and comes with an interactive
    checklist and worked examples.
- predicate: skos:prefLabel
  schema_type: dlthings:AttributeSpecification
  value: STAMPED Principles
- predicate: dlthings:title
  schema_type: dlthings:AttributeSpecification
  value: STAMPED Principles
- predicate: dlthings:short_name
  schema_type: dlthings:AttributeSpecification
  value: STAMPED Principles
- predicate: dlthings:description_html
  schema_type: dlthings:AttributeSpecification
  value: <p> <a href="https://stamped-principles.org">STAMPED</a> is a set of seven principles,
    Self-containment, Tracking, Actionability, Modularity, Portability, Ephemerality,
    and Distributability, for building research objects that others can trust, rerun,
    and build upon. Each principle is a spectrum from a practical minimum to an aspirational
    ideal, so adoption can be incremental and start from existing practice. STAMPED grew
    out of <a href="https://f1000research.com/posters/7-1965">YODA</a> and comes with
    an <a href="https://checklist.stamped-principles.org">interactive checklist</a> and
    <a href="https://examples.stamped-principles.org">worked examples</a>. </p>
