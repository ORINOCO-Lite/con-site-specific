  value: '<p> <a href="https://github.com/dandi-compute">DANDI Compute</a> runs
    processing pipelines directly on <a href="/projects#dandi_">DANDI</a> assets,
    rather than asking everyone to download them first. The first campaign applies
    the <a href="https://github.com/AllenNeuralDynamics/aind-ephys-pipeline">AIND
    ephys pipeline</a> to electrophysiology dandisets. </p> <ul> <li> <a href="https://github.com/dandi-compute/dandi-compute-core">dandi-compute-core</a>:
