- predicate: dlthings:title
  schema_type: dlthings:AttributeSpecification
  value: DataLad
- predicate: dlthings:description_html
  schema_type: dlthings:AttributeSpecification
  value: <p> <a href="https://datalad.org">DataLad</a> is ongoing work funded by NSF and
    German BMBF, to adapt the model of open-source software (OSS) distributions to address
    the technical limitations of today's data-sharing and provides a versatile data management
    platform. It uses software for data tracking and deployment logistics specialized
    for large data (<a class="reference external" href="http://git-annex.branchable.com">git-annex</a>)
    built atop <a class="reference external" href="http://git-scm.com">Git</a>, the most
    capable distributed version control system (dVCS) available today. DataLad provides
    access to data available from various sources (e.g. lab or consortium web-sites such
    as <a class="reference external" href="http://humanconnectome.org">humanconnectome.org</a>;
    data sharing portals such as <a class="reference external" href="http://openneuro.org">openneuro.org</a>
    and <a class="reference external" href="http://crcns.org">crcns.org</a>) through a
    single interface. It enables students and scientists to operate on data using familiar
    concepts, such as files and directories, while transparently managing data access
    and authorization with underlying hosting providers. </p>
