- predicate: dcterms:description
  schema_type: dlthings:AttributeSpecification
  value: 'MyKrok (Ukrainian: "мій крок" — "my step") is a CLI tool to incrementally back
    up fitness activities from Strava, including GPS tracks, photos, comments, and kudos.
    Backups are browsable offline through a built-in web frontend with interactive maps
    and activity statistics — applying the same git-annex / open-data philosophy of CON''s
    archival tools to personal fitness data. Try the live demo with synthetic data.'
