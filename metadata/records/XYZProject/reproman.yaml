- predicate: dlthings:description_html
  schema_type: dlthings:AttributeSpecification
  value: <p> <a href="https://github.com/repronim/niceman">ReproMan (Reproducible computational
    environments Manager; formerly known as REPROMAN)</a> is also a part of the NIH supported
    <a href="http://repronim.org">ReproNim</a> effort. It aims to facilitate reproducible
    computation via collection of detailed information about origin of the used components
    (Debian and/or Conda packages, VCS repositories, etc), so that computational environments
    could be analyzed, and re-created. </p>
