attributes:
- predicate: skos:prefLabel
  schema_type: dlthings:AttributeSpecification
  value: HeuDiConv / ReproIn
- predicate: dcterms:description
  schema_type: dlthings:AttributeSpecification
  value: HeuDiConv is a flexible DICOM converter for organizing brain imaging data into
    structured directory layouts. As a part of the larger, NIH supported ReproNim effort,
    we are developing a HeuDiConv-based ReproIn solution for turnkey automatic conversion
    of all collected MR data to a collection of the BIDS DataLad datasets. It includes
    a flexible BIDS-like specification how to name scanning sequences in the scanner,
    and a HeuDiConv reproin.py heuristic to automate layout and conversion of the datasets.
    This solution is deployed at DBIC (Dartmouth Brain Imaging Center), it already facilitates
    reproducible research, data sharing, and uploads to central archives such as NDA.
- predicate: dlthings:title
  schema_type: dlthings:AttributeSpecification
  value: HeuDiConv / ReproIn
- predicate: dlthings:short_name
  schema_type: dlthings:AttributeSpecification
  value: HeuDiConv / ReproIn
