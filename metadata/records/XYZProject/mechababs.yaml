- predicate: dlthings:description_html
  schema_type: dlthings:AttributeSpecification
  value: '<p> <a href="https://github.com/con/mechababs">mechababs</a> runs <a href="https://bids-apps.neuroimaging.io">BIDS
    Apps</a> over many studies on an HPC cluster, with <a href="https://github.com/PennLINC/babs">BABS</a>
    running the jobs. It works on a BIDS study, adding derivatives to it, and records
    how each one was made inside the study itself: the exact mechababs and BABS versions
    pinned in a lock, and every orchestration step as a <a href="#datalad_">DataLad</a>
    run record. A superstudy groups many studies so one campaign sweeps them all, which
    is how mechababs feeds <a href="https://github.com/OpenNeuroStudies/OpenNeuroStudies">OpenNeuroStudies</a>.
    </p>'
