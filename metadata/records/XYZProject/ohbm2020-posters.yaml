- predicate: dcterms:description
  schema_type: dlthings:AttributeSpecification
  value: 'A centralized registry of posters and their Jitsi rooms for OHBM 2020, the first
    edition held entirely online. The conference had no working way for an attendee to
    find a poster and walk up to its author; this gave it one, as a browsable catalogue
    backed by a DataLad dataset. Archived since 2022: it did its job for the meeting it
    was built for.'
