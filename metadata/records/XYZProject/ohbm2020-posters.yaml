- predicate: dlthings:description_html
  schema_type: dlthings:AttributeSpecification
  value: '<p> <a href="https://datalad-datasets.github.io/ohbm2020-posters/">OHBM 2020
    posters</a> was a centralized registry of posters and their <a href="https://jitsi.org">Jitsi</a>
    rooms for <a href="https://www.humanbrainmapping.org">OHBM</a> 2020, the first edition
    held entirely online. The conference had no working way for an attendee to find a
    poster and walk up to its author; this gave it one, as a browsable catalogue backed
    by a <a href="/projects#datalad_">DataLad</a> dataset. Twenty-three people contributed
    to it in the weeks around the meeting. <a href="https://github.com/datalad-datasets/ohbm2020-posters">Archived</a>
    since 2022: it did its job for the meeting it was built for. </p>'
