  value: '<figure> <a href="https://registry.datalad.org"> <img src="/theme/img/3rd/registry_logo.svg"
    alt="DataLad-Registry" class="pull-right" style="height:4.4em;padding-left:1em;margin-top:-0.3em;"/></a>
    </figure> <p> <a href="https://registry.datalad.org">DataLad-Registry</a> is a service
    that maintains up-to-date information on an expanding collection of datasets, currently
    numbering over ten thousand. It automatically registers datasets from various online
    sources, extracts metadata, and keeps both the datasets and their metadata current.
    DataLad-Registry offers search functionalities, including metadata-based searches,
    accessible through both a web interface and a RESTful API. Registry is regularly updated
    with DataLad datasets discovered across multiple hosting portals and listed on our
    <a href="https://github.com/datalad/datalad-usage-dashboard/">DataLad Usage Dashboard</a>.
    </p> <ul> <li> 🎬 <a href="https://datasets.datalad.org/repronim/ReproTube/web/#/channel/DataLad/video/_McJ1BtLsiQ">Talk
