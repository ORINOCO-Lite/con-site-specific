  value: Research Professor of Psychological and Brain Sciences and Adjunct Professor
    of Computer Science at Dartmouth, official Debian Developer, contributor to <a href="https://www.openhub.net/accounts/yarikoptic">many</a>
    open source projects -- Yaroslav (AKA Yarik) is a lead of <a href="xyzrins:projects/dandi">DANDI</a>,
    <a href="xyzrins:projects/datalad">DataLad</a>, <a href="xyzrins:projects/pymvpa">PyMVPA</a>,
    <a href="xyzrins:projects/neurodebian">NeuroDebian</a>, and other <a href="/projects">projects</a>.
    He is also currently serving on the <a href="xyzrins:projects/nwb">NWB</a> standard technical
    advisory committee, previously served on the <a href="xyzrins:projects/bids">BIDS</a>
    Steering Group, and is engaged in various other initiatives, projects, and efforts.
