- predicate: dlthings:description_html
  schema_type: dlthings:AttributeSpecification
  value: Studies neuroimaging reproducibility, and in particular the variability that
    analytical pipelines introduce and its impact on reusing brain imaging data. A member
    of the <a href="/projects#brain_imaging_data_structure_bids_">BIDS</a> Steering Group,
    the lead of <a href="/projects#bep028_">BEP028</a> (BIDS provenance), and the principal
    developer of NIDM-Results within <a href="/projects#nidm_">NIDM</a>. The collaboration
    began at the INCF Neuroimaging Data Sharing Task Force meeting in San Diego in November
    2013, and runs through NIDM, BIDS and its provenance extension, and the <a href="/projects#open_brain_consent_">Open
    Brain Consent</a>, which she helped translate into French.
description: Neuroinformatics researcher at Inria in Rennes who studies neuroimaging
  reproducibility and the variability of analytical pipelines. A member of the BIDS Steering
  Group, the lead of BEP028 (BIDS provenance), and the principal developer of NIDM-Results.
