# Fail2Ban is the counter-example worth keeping: an association with no CON
# connection at all, on software with 18764 stars that much of the field runs
# without thinking about it.
#
# It is also the clearest case of a role CHANGING over time, which is why the
# record holds two Associations rather than one with a bag of roles.  The
# Debian packaging started five months BEFORE the first upstream commit and
# ended five years before the last one.  A single span would have erased both
# facts.
#
#   packager   2005-07-04 .................... 2018-04-04
#   upstream        2005-12-27 ................................ 2023-11-22
#
record: xyzrins:projects/fail2ban
format: con-association-evidence-v1

assertions:
  # --- the Debian packaging ---------------------------------------------
  - path: /associated_with/0/started/at_time
    value: "2005-07-04"
    bound: upper
    kind: debian-changelog
    source: https://salsa.debian.org/python-team/packages/fail2ban
    locator: 0.4.1-1, oldest entry
    quote: '* First upstream release of a Debian package'
    note: >-
      The oldest of 141 changelog entries, and YOH's.  Upper bound: packaging
      precedes the upload that records it.  112 of the 141 entries (79%) are
      his.
    confidence: certain
    captured: "2026-10-10"

  - path: /associated_with/0/ended/at_time
    value: "2018-04-04"
    bound: lower
    kind: debian-changelog
    source: https://salsa.debian.org/python-team/packages/fail2ban
    locator: 0.10.2-2, YOH's last trailer
    quote: ' -- Yaroslav Halchenko <debian@onerussian.com>  Wed, 04 Apr 2018'
    note: >-
      Last entry under YOH's name.  The next entry is Sylvestre Ledru's on
      2020-01-12, so the handover sits in that gap; the changelog is still
      active in 2026 under Dale Richards.  The package outlived the
      maintainer, which is the point.
    confidence: certain
    captured: "2026-10-10"

  - path: /associated_with/0/ended/object
    value: xyzrins:persons/sylvestre-ledru
    kind: debian-changelog
    source: https://salsa.debian.org/python-team/packages/fail2ban
    locator: first non-YOH entry
    quote: ' -- Sylvestre Ledru  Sun, 12 Jan 2020'
    note: >-
      The trigger that ended the packaging role: the next maintainer, with 23
      entries.  Named as a person rather than the team, because the changelog
      names a person.
    confidence: certain
    captured: "2026-10-10"

  # --- upstream ----------------------------------------------------------
  - path: /associated_with/1/started/at_time
    value: "2005-12-27"
    bound: upper
    kind: upstream-git
    source: https://github.com/fail2ban/fail2ban
    locator: 3eb0ca0ee
    quote: propagated fix for the path bug. Thanks to Nick Craig-Wood
    note: >-
      Oldest commit authored by yarikoptic, from the GitHub commits API paged
      to its last page (989 commits).  Upper bound: the GitHub repository was
      created 2011-09-28, so the history was imported and anything before the
      import is invisible.  Note this is FIVE MONTHS AFTER the packaging
      started -- the Debian package came first, and the upstream involvement
      grew out of maintaining it.  The date also sits one day before
      fsl/debian/changelog bottoms out at 2005-12-28, the same weeks as the
      pkg-exppsy work.
    confidence: certain
    captured: "2026-10-10"

  - path: /associated_with/1/ended/at_time
    value: "2023-11-22"
    bound: lower
    kind: upstream-git
    source: https://github.com/fail2ban/fail2ban
    locator: 22ce0c053
    quote: Merge pull request #3630 from yarikoptic/enh-codespell
    note: >-
      Newest commit authored by yarikoptic -- five years after the packaging
      role ended.  Lower bound: involvement leaving no commit does not show.
    confidence: certain
    captured: "2026-10-10"

  - path: /associated_with/1/roles/0
    value: marcrel:led
    kind: registry
    source: https://api.github.com/repos/fail2ban/fail2ban/contributors
    locator: contributors, ranked by commit count
    quote: '"login": "yarikoptic", "contributions": 989'
    note: >-
      Second of 8+ contributors by commit count, behind sebres (2420) and
      ahead of grooverdan (854).  Commit rank evidences sustained
      maintenance, not a formal title; `marcrel:led` rests on the user's own
      account of having been lead developer and maintainer, and this
      corroborates its scale rather than proving the title.
    confidence: approximate
    captured: "2026-10-10"
