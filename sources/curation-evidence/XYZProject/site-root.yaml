# When people joined CON and when they left, derived from the site's own git
# history: whoweare.html has 128 commits back to 2015-07-21, so the commit
# that first mentions someone bounds their arrival and the commit that first
# files them under Emeritus bounds their departure.
#
# `started` entries are UPPER bounds -- the page is edited after someone
# joins.  `ended` entries declare `artifact: record`, because a commit filing
# someone under Emeritus is a record of the departure written after it, not
# the newest trace of their work.
#
# NOT dated: the five entries present in the very first commit (YOH, plus
# Simon Tennant / Guilherme Santos / Mizar Fernandez / a literal "TODO",
# leftovers of the buddycloud theme this repo was imported from).  For those
# the date bounds the REPOSITORY, not the person.
#
# NOT derived here: Michael Hanke and Chris Markiewicz, whose associations
# are dated from the work rather than from the page, and Adina Wagner's
# second association, which begins when con.org 85ca73100 moved her back from
# Emeritus to Collaborators.
